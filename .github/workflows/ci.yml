name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flutter-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

  functions-build:
    name: Cloud Functions Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Build TypeScript Functions
        working-directory: functions
        run: npm run build

  build-apk:
    name: Build Android Release APK
    needs: [flutter-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using custom signing keystore from secrets."
          fi

      - name: Prepare google-services.json for CI
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f android/app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
              echo "Using base64-decoded google-services.json from GOOGLE_SERVICES_JSON_BASE64."
            elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
              # In case GOOGLE_SERVICES_JSON was base64 encoded
              if ! grep -q '^{' android/app/google-services.json && echo "$GOOGLE_SERVICES_JSON" | base64 -d >/dev/null 2>&1; then
                echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
                echo "Decoded base64-encoded GOOGLE_SERVICES_JSON."
              else
                echo "Using raw GOOGLE_SERVICES_JSON from secrets."
              fi
            else
              cp android/app/google-services.json.example android/app/google-services.json
              echo "Warning: Using mock google-services.json.example. Provide GOOGLE_SERVICES_JSON secret for full runtime parity."
            fi

            # Robust JSON validation: Ensure the resulting file is valid JSON before Gradle runs
            if ! python3 -m json.tool android/app/google-services.json > /dev/null 2>&1; then
              echo "::warning::android/app/google-services.json is malformed or corrupted! Falling back to google-services.json.example to ensure build succeeds."
              cp -f android/app/google-services.json.example android/app/google-services.json
            fi
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fitbit-health-dashboard-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
