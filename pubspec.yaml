name: fitbit_health_dashboard
description: Flutter health dashboard connecting Fitbit data via Google Health API v4.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3

  # Local Notifications
  flutter_local_notifications: ^17.2.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Navigation
  go_router: ^14.2.7

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP & Networking
  http: ^1.2.2

  # URL Launcher & Deep Linking
  url_launcher: ^6.3.0
  app_links: ^6.2.0

  # Secure Local Storage (Local OAuth Token & Refresh Token storage)
  flutter_secure_storage: ^9.2.2

  # Permissions (Activity Recognition)
  permission_handler: ^11.3.1

  # Charts
  fl_chart: ^0.69.0

  # Date/Time utilities
  intl: ^0.19.0

  # PDF Generation & Downloads
  pdf: ^3.11.1
  path_provider: ^2.1.5
  open_filex: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  mockito: ^5.4.4
  fake_cloud_firestore: ^3.0.3

flutter:
  uses-material-design: true

